<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drifter Animation Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme: dark; --ink:#17151a; --panel:#1d1b20; --line:#3a353b; --text:#ece5de; --muted:#9b918b; --skin:#d99e68; --new:#7fbf8e;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 14px var(--body); }
body { display: grid; grid-template-columns: 260px 1fr; height: 100vh; overflow: hidden; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 20px; }
h1 { margin: 0 0 2px; font: 700 18px var(--display); letter-spacing: .14em; text-transform: uppercase; }
h1 span { color: var(--skin); }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; line-height: 1.4; }
.group { font: 500 11px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
button.clip { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; color: var(--text);
  border: 1px solid transparent; border-radius: 4px; padding: 5px 8px; font: 13px var(--body); cursor: pointer; }
button.clip:hover { background: #2a272d; }
button.clip.on { border-color: var(--skin); background: #2a2420; }
button.clip i { font: 10px var(--mono); font-style: normal; color: var(--muted); }
button.clip i.new { color: var(--new); }
main { position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; }
.bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; background: #1d1b20e8;
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; flex-wrap: wrap; }
.bar button, .bar select { font: 500 12px var(--body); background: #2a272d; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; }
.bar button.on { border-color: var(--skin); color: var(--skin); }
.bar input[type=range] { flex: 1; min-width: 120px; accent-color: var(--skin); }
.bar .t { font: 12px var(--mono); color: var(--muted); min-width: 92px; text-align: right; }
.info { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; gap: 12px; }
.info .name { font: 700 22px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.info .desc { color: var(--muted); font-size: 13px; max-width: 560px; margin-top: 2px; line-height: 1.45; }
.warn { font: 11px var(--mono); color: #d9685c; }
@media (max-width: 720px) {
  body { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .info .desc { display: none; }
}
</style>
</head>
<body>
<aside>
  <h1>Drift<span>e</span>r anim lab</h1>
  <p class="sub">Every clip here is keyframed by hand in code: feet and hands are placed with IK so they plant on the floor and grip edges. <b style="color:var(--new)">new</b> = rebuilt from scratch, <b>kept</b> = original clip you liked, cleaned up.</p>
  <div id="list"></div>
</aside>
<main>
  <canvas id="c"></canvas>
  <div class="info"><div><div class="name" id="name">Loading…</div><div class="desc" id="desc"></div><div class="warn" id="warn"></div></div></div>
  <div class="bar">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span class="t" id="time">0.00 s</span>
    <select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
    <button data-view="three" class="on">3/4</button><button data-view="side">Side</button><button data-view="front">Front</button><button data-view="back">Back</button>
    <button id="rmb" class="on" title="Move the character with the clip's root motion">Root motion</button>
  </div>
</main>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { PoseRig } from "./anim/rig.js";
import { buildClips } from "./anim/clips.js";

const $ = (id) => document.getElementById(id);
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x26252b);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.95, 0.4); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe6f2, 0x3a3430, 1.2));
const sun = new THREE.DirectionalLight(0xfff1e0, 2.2); sun.position.set(4, 8, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); sun.shadow.bias = -0.0005; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x7e8087, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(40, 80, 0x5d5f66, 0x6b6d73); grid.position.y = 0.002; scene.add(grid);
const propMat = new THREE.MeshStandardMaterial({ color: 0xb9bcc3, roughness: 0.9, transparent: true, opacity: 0.92 });
const accent = new THREE.MeshStandardMaterial({ color: 0xd9a066, roughness: 0.6 });
const props = new THREE.Group(); scene.add(props);
function resize() { const r = canvas.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener("resize", resize);

const loader = new GLTFLoader();
const gltf = await loader.loadAsync("assets/drifter.glb");
const model = gltf.scene;
model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; const m = o.material; if (m.map) { m.map.magFilter = m.map.minFilter = THREE.NearestFilter; m.map.generateMipmaps = false; m.map.needsUpdate = true; } m.flatShading = true; m.roughness = 0.85; m.metalness = 0; m.needsUpdate = true; } });
const root = new THREE.Group(); root.add(model); scene.add(root);
const rig = new PoseRig(model);
const LIB = buildClips(rig, gltf.animations, model); window.__rig = rig; window.__LIB = LIB;
const mixer = new THREE.AnimationMixer(model);
let cur = null, action = null, playing = true, useRM = true, view = "three";
const pipe = new THREE.Group();
{ const m = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.95, 7), new THREE.MeshStandardMaterial({ color: 0x8a7f78, roughness: 0.45, metalness: 0.6 })); m.castShadow = true; pipe.add(m);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.08, 7), m.material); cap.position.y = 0.45; pipe.add(cap); }
const hand = model.getObjectByName("mixamorigRightHand");

// list
const groups = {};
for (const [name, e] of Object.entries(LIB)) (groups[e.group] ??= []).push(name);
for (const [g, names] of Object.entries(groups)) {
  const h = document.createElement("div"); h.className = "group"; h.textContent = g; $("list").append(h);
  for (const n of names) {
    const b = document.createElement("button"); b.className = "clip"; b.dataset.name = n;
    b.innerHTML = `<span>${n.replace(/_/g, " ")}</span><i class="${LIB[n].kept ? "" : "new"}">${LIB[n].kept ? "kept" : "new"}</i>`;
    b.onclick = () => show(n); $("list").append(b);
  }
}
function setProps(e) {
  props.clear();
  for (const p of e.props || []) {
    const [x, y, z, sx, sy, sz] = p.box;
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), p.accent ? accent : propMat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; props.add(m);
  }
  if (e.pipe) { if (!pipe.parent || pipe.parent !== hand) { hand.add(pipe); } LIB.__attachPipe?.(pipe); } else if (pipe.parent) pipe.parent.remove(pipe);
}
function show(name) {
  const e = LIB[name]; if (!e) return; cur = name;
  document.querySelectorAll("button.clip").forEach((b) => b.classList.toggle("on", b.dataset.name === name));
  mixer.stopAllAction(); action = mixer.clipAction(e.clip); action.reset().play(); action.setLoop(THREE.LoopRepeat);
  $("name").textContent = name.replace(/_/g, " "); $("desc").textContent = e.desc || ""; $("warn").textContent = (e.warn || []).join(" · ");
  setProps(e); setView(view, true);
  history.replaceState(null, "", "#" + name);
}
function setView(v, snap) {
  view = v; document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  const e = LIB[cur]; const c = e?.focus || [0, 0.95, 0.5];
  controls.target.set(...c);
  const d = e?.dist || 4.2;
  const dirs = { three: [0.75, 0.32, 0.62], side: [1, 0.12, 0], front: [0.05, 0.15, 1], back: [0.55, 0.3, -1] };
  const dv = new THREE.Vector3(...dirs[v]).normalize().multiplyScalar(d);
  camera.position.set(c[0] + dv.x, c[1] + dv.y, c[2] + dv.z);
}
document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => setView(b.dataset.view));
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("rmb").onclick = () => { useRM = !useRM; $("rmb").classList.toggle("on", useRM); };
$("scrub").oninput = () => { if (!action) return; playing = false; $("play").textContent = "Play"; action.time = $("scrub").value / 1000 * action.getClip().duration; };

function applyRM() {
  const e = LIB[cur]; root.position.set(0, 0, 0); root.rotation.y = 0;
  if (!e?.rm || !useRM || !action) return;
  const t = action.time, rm = e.rm; const ts = rm.times; let i = 1; while (i < ts.length - 1 && ts[i] < t) i++;
  const a = Math.min(1, Math.max(0, (t - ts[i - 1]) / (ts[i] - ts[i - 1] || 1)));
  root.position.copy(rm.vals[i - 1]).lerp(rm.vals[i], a); root.rotation.y = rm.yaw ? rm.yaw[i - 1] + (rm.yaw[i] - rm.yaw[i - 1]) * a : 0;
}
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (action) {
    if (playing) mixer.update(dt * +$("speed").value); else mixer.update(0);
    applyRM();
    const d = action.getClip().duration; $("scrub").value = (action.time % d) / d * 1000; $("time").textContent = (action.time % d).toFixed(2) + " / " + d.toFixed(2) + " s";
  }
  controls.update(); renderer.render(scene, camera);
}
resize();
show(LIB[location.hash.slice(1)] ? location.hash.slice(1) : Object.keys(LIB)[0]);
frame();

// test hooks for automated review: render a contact sheet of a clip
window.__lab = {
  names: () => Object.keys(LIB),
  warn: () => Object.fromEntries(Object.entries(LIB).filter(([, e]) => e.warn?.length).map(([n, e]) => [n, e.warn])),
  sheet(name, n = 8, v = "side", w = 220, h = 300) {
    if (v === "auto") v = LIB[name].props?.length || LIB[name].rm ? "side" : "three";
    show(name); if (v !== "ortho") setView(v, true); playing = false;
    const dur = action.getClip().duration;
    // orthographic side view (from the character's left), framed on the clip's focus
    const e = LIB[name], f = e.focus || [0, 0.95, 0.5], half = Math.max(1.3, (e.dist || 4.2) * 0.42);
    const ortho = new THREE.OrthographicCamera(-half * w / h, half * w / h, half, -half, 0.1, 50);
    ortho.position.set(f[0] + 10, f[1], f[2]); ortho.lookAt(f[0], f[1], f[2]);
    const out = document.createElement("canvas"); out.width = w * n; out.height = h; const g = out.getContext("2d");
    const old = [renderer.domElement.width, renderer.domElement.height];
    renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    for (let i = 0; i < n; i++) {
      action.time = dur * i / (n - (LIB[name].loop ? 0 : 1)); mixer.update(0); applyRM();
      if (v === "ortho") renderer.render(scene, ortho); else { setView(v, true); controls.update(); renderer.render(scene, camera); } g.drawImage(renderer.domElement, i * w, 0);
      g.fillStyle = "#ece5de"; g.font = "12px monospace"; g.fillText(action.time.toFixed(2), i * w + 6, 16);
    }
    resize();
    return out.toDataURL("image/png");
  },
};
</script>
</body>
</html>
